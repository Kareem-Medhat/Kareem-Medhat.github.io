<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kareem Medhat — Sites</title>
    <meta name="description" content="Websites published by Kareem Medhat." />
    <meta name="author" content="Kareem Medhat" />
    <link rel="icon" href="portofolio/favicon.svg" type="image/svg+xml" />

    <script>
      // Same origin as the portfolio, so honour the theme a visitor already picked there.
      try {
        const stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") document.documentElement.dataset.theme = stored;
      } catch {
        // Storage can be blocked: the media query below covers the system preference.
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        color-scheme: light;
        --paper: #ecebf5;
        --ink: #1b1830;
        --ink-2: #5d5a74;
        --rule: #cbc8de;
        --violet: #5b45f0;

        --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-serif: "Instrument Serif", ui-serif, Georgia, serif;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --paper: #15131f;
        --ink: #ecebf5;
        --ink-2: #9b98b0;
        --rule: #2e2b40;
        --violet: #a89bff;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --paper: #15131f;
          --ink: #ecebf5;
          --ink-2: #9b98b0;
          --rule: #2e2b40;
          --violet: #a89bff;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 1.0625rem;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        flex: 1;
        width: 100%;
        max-width: 64rem;
        margin: 0 auto;
        padding: clamp(3rem, 10vh, 7rem) clamp(1rem, 5vw, 3rem) 3rem;
        display: flex;
        flex-direction: column;
      }

      .intro h1 {
        margin: 0;
        font-size: 1.0625rem;
        font-weight: 500;
      }

      .intro p {
        margin: 0.25rem 0 0;
        max-width: 40ch;
        color: var(--ink-2);
      }

      .sites {
        list-style: none;
        margin: clamp(3rem, 12vh, 8rem) 0 0;
        padding: 0;
      }

      .site {
        border-top: 1px solid var(--rule);
      }

      .site:last-child {
        border-bottom: 1px solid var(--rule);
      }

      .site a {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 18rem);
        align-items: end;
        gap: 0.5rem 2rem;
        padding: 1.5rem 0 1.75rem;
        color: inherit;
        text-decoration: none;
      }

      .site__url {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .site__host {
        font-size: 0.9375rem;
        color: var(--ink-2);
      }

      .site__path {
        font-family: var(--font-serif);
        font-weight: 400;
        font-size: clamp(3rem, 22vw, 8.5rem);
        line-height: 0.9;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
        transition: transform 280ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .site__slash {
        display: inline-block;
        color: var(--violet);
        transition: transform 280ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .site__about {
        margin: 0;
        padding-bottom: 0.6rem;
        color: var(--ink-2);
        max-width: 30ch;
      }

      .site a:hover .site__path,
      .site a:focus-visible .site__path {
        transform: translateX(0.12em);
      }

      .site a:hover .site__slash,
      .site a:focus-visible .site__slash {
        transform: skewX(-14deg);
      }

      .site a:focus-visible {
        outline: 2px solid var(--violet);
        outline-offset: 4px;
      }

      .footer {
        margin-top: auto;
        padding-top: 4rem;
        font-size: 0.9375rem;
        color: var(--ink-2);
      }

      .footer a {
        color: var(--ink);
        text-underline-offset: 0.2em;
        text-decoration-color: var(--rule);
      }

      .footer a:hover {
        text-decoration-color: var(--violet);
      }

      .footer a:focus-visible {
        outline: 2px solid var(--violet);
        outline-offset: 2px;
        border-radius: 2px;
      }

      @media (max-width: 40rem) {
        .site a {
          grid-template-columns: minmax(0, 1fr);
        }

        .site__about {
          padding-bottom: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .site__path,
        .site__slash {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <header class="intro">
        <h1>Kareem Medhat</h1>
        <p>Websites I've published. New ones get added to this list.</p>
      </header>

      <ul class="sites">
        <li class="site">
          <a href="portofolio/">
            <span class="site__url">
              <span class="site__host">kareem-medhat.github.io</span>
              <span class="site__path"><span class="site__slash">/</span>portofolio</span>
            </span>
            <p class="site__about">My portfolio: the systems I've built, my stack, and how to reach me.</p>
          </a>
        </li>
      </ul>

      <footer class="footer">
        Find me on <a href="https://github.com/Kareem-Medhat" target="_blank" rel="noopener">GitHub</a>
      </footer>
    </main>
  </body>
</html>
